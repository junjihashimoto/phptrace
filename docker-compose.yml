services:
  php:
    build: ./app
    volumes:
      - ./app/src:/var/www/html:ro
      - ./data:/data
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_DSN: "mysql:host=mysql;dbname=demo;charset=utf8mb4"
      DB_USER: demo
      DB_PASS: demo

  nginx:
    image: nginx:1.27
    ports:
      - "8081:80"
    volumes:
      - ./app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/src:/var/www/html:ro
    depends_on:
      - php

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
    volumes:
      - ./app/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 2s
      timeout: 2s
      retries: 30

  loadgen:
    image: curlimages/curl:latest
    volumes:
      - ./loadgen/loadgen.sh:/loadgen.sh:ro
    entrypoint: ["/bin/sh", "/loadgen.sh"]
    environment:
      BASE_URL: http://nginx
      CONCURRENCY: "3"
    depends_on:
      - nginx

  apache74:
    profiles: ["legacy"]
    build: ./app74
    ports:
      - "8082:80"
    volumes:
      - ./app74/src:/var/www/html:ro
      - ./app/src:/var/www/shared:ro
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_DSN: "mysql:host=mysql;dbname=demo;charset=utf8mb4"
      DB_USER: demo
      DB_PASS: demo

  loadgen74:
    profiles: ["legacy"]
    image: curlimages/curl:latest
    volumes:
      - ./loadgen/loadgen.sh:/loadgen.sh:ro
    entrypoint: ["/bin/sh", "/loadgen.sh"]
    environment:
      BASE_URL: http://apache74
      CONCURRENCY: "2"
      EP_SUFFIX: ".php"
    depends_on:
      - apache74

  tracer:
    build: ./tracer
    privileged: true
    pid: "host"
    volumes:
      - ./data:/data
      - /sys/kernel/debug:/sys/kernel/debug
    depends_on:
      - php

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      DB_PATH: /data/apm.sqlite
      DATA_DIR: /data
      PORT: "8080"
      RETENTION_HOURS: "2"

  tui:
    profiles: ["tui"]
    build:
      context: .
      dockerfile: ui/Dockerfile
    entrypoint: ["/app/apm_top"]
    volumes:
      - ./data:/data
    environment:
      DB_PATH: /data/apm.sqlite

  # ---- native profile: the SAME sampling method applied to a non-PHP app.
  # native-tracer swaps the Zend-VM walker for native (frame-pointer) stack
  # unwinding; the entire downstream UI is reused unchanged on :8091.

  memcached:
    profiles: ["native"]
    build: ./memcached

  memcached-load:
    profiles: ["native"]
    image: busybox
    volumes:
      - ./memcached/load.sh:/load.sh:ro
    entrypoint: ["sh", "/load.sh"]
    environment:
      MC_HOST: memcached
      CONCURRENCY: "4"
    depends_on:
      - memcached

  native-tracer:
    profiles: ["native"]
    build: ./native-tracer
    privileged: true
    pid: "host"
    volumes:
      - ./data-native:/data
      - /sys/kernel/debug:/sys/kernel/debug
    environment:
      TARGET_COMM: memcached
      SAMPLE_FREQ: "99"          # sampling period knob (Hz)
      MAX_SAMPLES_PER_SEC: "500" # hard ceiling on samples/s, core-independent
      FLUSH_SEC: "10"            # aggregate window; store rows = distinct stacks
      MAX_NDJSON_MB: "64"        # cap the intermediate ndjson (rotated past it)
      # request-boundary latency probe (surface interface only, 1 uprobe/op).
      # memcached's text command dispatch; "" disables (sampling only).
      PROBE_FUNC: "process_command_ascii"
      PROBE_SAMPLE: "1"          # record 1 in N ops (raise to cut volume)
    depends_on:
      - memcached

  ui-native:
    profiles: ["native"]
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "8091:8080"
    volumes:
      - ./data-native:/data
    environment:
      DB_PATH: /data/apm.sqlite
      DATA_DIR: /data
      PORT: "8080"
      RETENTION_HOURS: "2"
      MAX_DB_MB: "256"          # hard ceiling on the SQLite file size

  # ---- bench profile (task #8): per-call uprobe vs bpftime vs sampling ----

  # Condition 3: high-frequency kernel uprobe on php-fpm (default _emalloc).
  # Attaches to the main demo's php-fpm workers (pid:host), so load is driven
  # against the normal nginx during this phase.
  percall:
    profiles: ["bench"]
    build: ./bench
    privileged: true
    pid: "host"
    volumes:
      - ./data:/data
      - /sys/kernel/debug:/sys/kernel/debug
    environment:
      # execute_ex (task default) fires ~1x/request on PHP 8.3 (ZEND_VM_ENTER
      # inlining); _emalloc (~87k/request) exposes real per-call trap cost.
      PROBE_FUNC: "${PROBE_FUNC:-execute_ex}"
      # When several php-fpm binaries run, pick the one whose environ contains
      # symbol (used to target php-dtrace, which exports dtrace_execute_ex).
      PHPFPM_MATCH_SYM: "${PHPFPM_MATCH_SYM:-}"
      # per-request sampling: trace the work for 1 in SAMPLE_N requests
      SAMPLE_N: "${SAMPLE_N:-1}"
      REQ_FUNC: "${REQ_FUNC:-php_request_startup}"

  # Condition 4: same eBPF program executed in userspace by bpftime.
  # php-fpm is launched with the bpftime agent LD_PRELOAD'd; the loader runs
  # under bpftime's syscall-server (see bench/bpftime-entry.sh).
  php-bench:
    profiles: ["bench"]
    build:
      context: ./bench
      dockerfile: Dockerfile.bpftime
      args:
        READ_CHECK: "${READ_CHECK:-ON}"
    privileged: true
    volumes:
      - ./app/src:/var/www/html:ro
      - ./data:/data
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_DSN: "mysql:host=mysql;dbname=demo;charset=utf8mb4"
      DB_USER: demo
      DB_PASS: demo
      PROBE_FUNC: "${PROBE_FUNC:-execute_ex}"
      # bpftime was built with the ubpf interpreter (BPFTIME_LLVM_JIT=OFF); the
      # agent otherwise defaults to the (absent) llvm VM and refuses to run.
      BPFTIME_VM_NAME: "ubpf"

  nginx-bench:
    profiles: ["bench"]
    image: nginx:1.27
    volumes:
      - ./bench/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/src:/var/www/html:ro
    depends_on:
      - php-bench

  # Design-B (per-request sampling) proxy: split_clients routes PCT% of /cpu
  # to the traced php-bench and the rest to plain php. Steady-state proxy for
  # per-request dynamic attach (omits the attach/detach patch cost).
  nginx-split:
    profiles: ["bench"]
    image: nginx:1.27
    volumes:
      - ./bench/nginx-split.conf:/etc/nginx/conf.d/default.conf
      - ./app/src:/var/www/html:ro
    depends_on:
      - php-bench
      - php

  # php-fpm built --enable-dtrace: with USE_ZEND_DTRACE=1 execute_ex fires PER
  # userland call (faithful 2024 prod repro). AGENT_MODE=1 runs it under the
  # bpftime agent; unset = plain php-fpm for the external kernel-uprobe.
  php-dtrace:
    profiles: ["bench"]
    build:
      context: ./bench
      dockerfile: Dockerfile.dtrace
    privileged: true
    volumes:
      - ./app/src:/var/www/html:ro
      - ./data:/data
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_DSN: "mysql:host=mysql;dbname=demo;charset=utf8mb4"
      DB_USER: demo
      DB_PASS: demo
      USE_ZEND_DTRACE: "${USE_ZEND_DTRACE:-1}"
      AGENT_MODE: "${AGENT_MODE:-0}"
      PROBE_FUNC: "${PROBE_FUNC:-execute_ex}"
      BPFTIME_VM_NAME: "ubpf"
      SAMPLE_N: "${SAMPLE_N:-1}"
      REQ_FUNC: "${REQ_FUNC:-php_request_startup}"

  nginx-dtrace:
    profiles: ["bench"]
    image: nginx:1.27
    volumes:
      - ./bench/nginx-dtrace.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/src:/var/www/html:ro
    depends_on:
      - php-dtrace

  # Observer-API condition (ddtrace-style selective in-process hooking) — the
  # fair "hook only what you need" competitor to the eBPF sampler.
  # OBS_ALL=1 observes every userland call; OBS_FUNCS=a,b,c selects functions.
  php-observer:
    profiles: ["bench"]
    build:
      context: ./bench
      dockerfile: Dockerfile.observer
    volumes:
      - ./app/src:/var/www/html:ro
      - ./data:/data
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_DSN: "mysql:host=mysql;dbname=demo;charset=utf8mb4"
      DB_USER: demo
      DB_PASS: demo
      OBS_ALL: "${OBS_ALL:-0}"
      OBS_FUNCS: "${OBS_FUNCS:-}"

  nginx-observer:
    profiles: ["bench"]
    image: nginx:1.27
    volumes:
      - ./bench/nginx-observer.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/src:/var/www/html:ro
    depends_on:
      - php-observer

  # (a) inline-guard / fire-floor investigation: dtrace PHP + LLVM-JIT bpftime.
  php-dtrace-jit:
    profiles: ["bench"]
    image: phptrace-php-dtrace-jit
    privileged: true
    volumes:
      - ./app/src:/var/www/html:ro
      - ./data:/data
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_DSN: "mysql:host=mysql;dbname=demo;charset=utf8mb4"
      DB_USER: demo
      DB_PASS: demo
      USE_ZEND_DTRACE: "1"
      AGENT_MODE: "1"
      PROBE_FUNC: "execute_ex"
      BPFTIME_VM_NAME: "llvm"
      SAMPLE_N: "${SAMPLE_N:-1}"
      REQ_FUNC: "php_request_startup"

  nginx-dtrace-jit:
    profiles: ["bench"]
    image: nginx:1.27
    volumes:
      - ./bench/nginx-dtrace-jit.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/src:/var/www/html:ro
    depends_on:
      - php-dtrace-jit
