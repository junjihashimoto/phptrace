; APM demo pool tuning: a fixed worker count keeps the tracer's
; pid discovery and per-worker sampling behavior predictable.
[www]
pm = static
pm.max_children = 4

; Access log with the fields the UI can join against uprobe spans:
; epoch(sec) pid duration(ms) method uri status
access.log = /tmp/phpfpm-access.log
; %{REQUEST_URI}e = original URI (nginx rewrites %r to /index.php)
access.format = "%{%s}t %p %{mili}d %m %{REQUEST_URI}e %s"
