server {
    listen 80;
    root /var/www/html;
    index index.php;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # FPM copies SCRIPT_NAME (not REQUEST_URI) into
        # sapi_globals.request_info.request_uri, which is what the eBPF
        # request-boundary probe reads. Hand it the original URI so traced
        # spans carry /fast, /db, ... instead of /index.php.
        fastcgi_param SCRIPT_NAME $request_uri;
    }
}
