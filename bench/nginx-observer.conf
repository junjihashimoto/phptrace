# nginx for the observer bench target: identical to the demo's nginx.conf but
# pointed at the php-bench fastcgi upstream (php-fpm running under the bpftime
# agent). Served on port 80 inside the compose network as http://nginx-bench.
server {
    listen 80;
    root /var/www/html;
    index index.php;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_pass php-observer:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $request_uri;
    }
}
