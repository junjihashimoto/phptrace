# nginx for the dtrace bench target: same as bench/nginx.conf but pointed at the
# php-dtrace fastcgi upstream. Served as http://nginx-dtrace in the compose net.
server {
    listen 80;
    root /var/www/html;
    index index.php;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_pass php-dtrace-jit:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $request_uri;
    }
}
